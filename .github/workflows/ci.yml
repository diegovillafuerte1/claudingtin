# ci — build, vet, test, and lint the workspace, validate and test the mod, and
# image-build the backend.
#
# Runs on every pull request and on push to main. Third-party Actions are pinned
# to a released major-version tag and limited to the set agreed for this repo:
# actions/checkout, actions/setup-go, docker/login-action, docker/build-push-action.
# The Go version always comes from go.work via setup-go's go-version-file —
# never a literal here.
#
# The test job runs on Linux, macOS, and Windows as standing regression
# insurance. Tests run under `-race` on every OS: the backend hub and the /v1
# long-poll transport are genuinely concurrent (epic-1 retrospective, finding F1).

name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.work
          cache: false
      - name: build
        shell: bash
        run: |
          mods=$(bash scripts/workspace_modules.sh) || { echo "::error::workspace_modules.sh failed"; exit 1; }
          read -ra mod_args <<<"$mods"
          [ "${#mod_args[@]}" -gt 0 ] || { echo "::error::no workspace modules resolved"; exit 1; }
          go build "${mod_args[@]}"
      - name: vet
        shell: bash
        run: |
          mods=$(bash scripts/workspace_modules.sh) || { echo "::error::workspace_modules.sh failed"; exit 1; }
          read -ra mod_args <<<"$mods"
          [ "${#mod_args[@]}" -gt 0 ] || { echo "::error::no workspace modules resolved"; exit 1; }
          go vet "${mod_args[@]}"
      - name: test
        shell: bash
        run: |
          mods=$(bash scripts/workspace_modules.sh) || { echo "::error::workspace_modules.sh failed"; exit 1; }
          read -ra mod_args <<<"$mods"
          [ "${#mod_args[@]}" -gt 0 ] || { echo "::error::no workspace modules resolved"; exit 1; }
          go test -race "${mod_args[@]}"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.work
          cache: false
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needs to run on:"
            echo "$unformatted"
            exit 1
          fi
      - name: go work sync is a no-op
        run: |
          go work sync
          git diff --exit-code
      - name: shellcheck
        shell: bash
        run: |
          # word-splitting the file list is intentional
          # shellcheck disable=SC2046
          shellcheck $(git ls-files '*.sh')
      - name: dependency-direction check
        run: bash scripts/check_deps.sh
      - name: workspace-module guard
        run: bash scripts/workspace_modules.sh --check
      - name: guard self-tests
        run: bash scripts/checks_test.sh

  plugin:
    # The mod (TypeScript in plugin/) is not a Go module: Claude Code itself
    # validates and tests it. Pinned to an exact version because the mods API is
    # early access and may churn between releases. Node and npm come with the
    # runner image, so no extra Action is needed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install Claude Code
        run: npm install -g @anthropic-ai/claude-code@2.1.311
      - name: hooks.json loads only the mod module
        run: jq -e '.modules == ["./register.tsx"] and (has("hooks") | not)' plugin/hooks/hooks.json
      - name: validate
        run: claude plugin validate --strict plugin
      - name: test
        run: claude plugin test plugin

  backend-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: build (push only on push to main)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ghcr.io/diegovillafuerte1/claudingtin-backend:edge
