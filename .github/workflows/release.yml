# release — cut shippable artifacts from a v* tag. Skeleton: structurally
# complete, but only ever triggered by a real tag push (none exist yet — do not
# create one just to exercise this).
#
# Trigger: `git push origin v0.1.0` (tag matching v*).
#
# What it does: builds deploy/Dockerfile and pushes
# ghcr.io/diegovillafuerte1/claudingtin-backend tagged with the bare version
# (v0.1.0 -> 0.1.0) and `latest`. There are no client binaries: the client is
# the mod in plugin/, which ships as source.
#
# Third-party Actions are pinned to a released major-version tag: actions/checkout,
# docker/login-action, docker/build-push-action.

name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  backend-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: derive version from the tag
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: build and push the backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: |
            ghcr.io/diegovillafuerte1/claudingtin-backend:${{ steps.version.outputs.version }}
            ghcr.io/diegovillafuerte1/claudingtin-backend:latest
